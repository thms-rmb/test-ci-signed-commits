name: commit-staged-using-rest
description: Creates a commit from staged changes with GitHub's Git Database API and updates the selected branch.
inputs:
  token:
    description: Token used by the GitHub CLI to access the GitHub API.
    required: true
  repository:
    description: Target repository in owner/name format.
    required: true
  ref:
    description: Full target branch ref, for example refs/heads/main.
    required: true
  working-directory:
    description: Directory containing the staged Git changes.
    required: false
    default: .
  message:
    description: Commit message.
    required: false
    default: Update staged files
runs:
  using: composite
  steps:
    - name: Create commit and update branch
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.token }}
        TARGET_REPOSITORY: ${{ inputs.repository }}
        TARGET_REF: ${{ inputs.ref }}
        COMMIT_MESSAGE: ${{ inputs.message }}
      run: |
        if [[ -z "${GH_TOKEN:-}" ]]; then
          echo "::error::The token input must not be empty."
          exit 1
        fi
        node "$GITHUB_ACTION_PATH/index.js"
