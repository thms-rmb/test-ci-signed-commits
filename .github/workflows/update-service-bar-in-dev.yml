name: Update service-bar in dev

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v7.0.1

      - name: Increment service-bar version
        shell: bash
        run: |
          version="$(< dev/service-bar-version)"
          if [[ ! "$version" =~ ^[0-9]+$ ]]; then
            echo "Expected dev/service-bar-version to contain a number." >&2
            exit 1
          fi
          printf '%s\n' "$((version + 1))" > dev/service-bar-version

      - name: Stage service-bar version
        run: git add dev/service-bar-version

      - name: Commit staged changes using REST
        uses: ./.github/actions/commit-staged-using-rest
        with:
          token: ${{ github.token }}
          message: "chore: update service-bar version in dev"
