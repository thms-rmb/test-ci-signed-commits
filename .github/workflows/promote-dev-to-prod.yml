name: Promote dev to prod

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote-versions:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v7.0.1

      - name: Copy dev versions to prod
        run: |
          cp dev/service-foo-version prod/service-foo-version
          cp dev/service-bar-version prod/service-bar-version

      - name: Stage production versions
        run: git add prod/service-foo-version prod/service-bar-version

      - name: Commit staged changes using REST
        uses: ./.github/actions/commit-staged-using-rest
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          message: "chore: promote dev versions to prod"
