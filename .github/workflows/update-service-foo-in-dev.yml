name: Update service-foo in dev

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v7.0.1

      - name: Increment service-foo version
        shell: bash
        run: |
          version="$(< dev/service-foo-version)"
          if [[ ! "$version" =~ ^[0-9]+$ ]]; then
            echo "Expected dev/service-foo-version to contain a number." >&2
            exit 1
          fi
          printf '%s\n' "$((version + 1))" > dev/service-foo-version

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/service-foo-version
          git commit -m "chore: update service-foo version in dev"
          git push origin "HEAD:$GITHUB_REF"
